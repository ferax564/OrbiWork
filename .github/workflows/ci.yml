name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit hashes so a moved tag cannot change what runs here.
jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install
      - run: vp run --filter @orbiwork/desktop ensure:electron
      - run: vp check
      - run: vp run typecheck
      - run: vp run knip:check
      - run: vp run i18n:check

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One failing group must not cancel the others; each reports on its own.
      fail-fast: false
      matrix:
        include:
          - name: server
            filter: "--filter orbi"
          - name: web
            filter: "--filter @orbiwork/web"
          - name: desktop
            filter: "--filter @orbiwork/desktop"
          - name: packages
            filter: "--filter '!@orbiwork/monorepo' --filter '!orbi' --filter '!@orbiwork/web' --filter '!@orbiwork/desktop'"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The desktop tests compile a small native helper that links libsecret.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install
      - run: vp run --filter @orbiwork/desktop ensure:electron
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - run: vp run --parallel --concurrency-limit 4 ${{ matrix.filter }} test
